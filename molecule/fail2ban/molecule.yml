---
driver:
  name: docker
platforms:
  - name: instance
    image: ansible-sys-fail2ban-test
    dockerfile: Dockerfile
    pre_build_image: false
    command: /lib/systemd/systemd
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
provisioner:
  name: ansible
