---
- name: Converge
  hosts: all
  become: true
  tasks:
    - name: Include ctsc.sys.ufw
      ansible.builtin.include_role:
        name: ctsc.sys.ufw
      vars:
        ufw_allow_rules:
          - port: "2222"
            proto: tcp
            comment: "molecule test rule"
          - port: "4444"
            proto: tcp
            comment: "molecule test rule to be removed"
          - port: "any"
            src: "172.18.0.0/16"
            comment: "molecule test any-port rule"
          - port: "2223"
            proto: tcp
            rule: limit
            comment: "molecule test limit rule"
          - port: "5555"
            proto: tcp
            rule: limit
            comment: "molecule test limit rule to be removed"
        ufw_route_rules:
          - src: "10.1.0.0/16"
            dest: "10.0.20.0/24"
            comment: "molecule test route rule"
          - src: "10.2.0.0/16"
            dest: "10.0.30.0/24"
            comment: "molecule test route rule to be removed"
          - src: "10.3.0.0/16"
            comment: "molecule test src-only route rule"
          - src: "10.4.0.0/16"
            dest: "10.4.0.0/16"
            port: "8443"
            proto: tcp
            rule: limit
            comment: "molecule test route limit rule"
