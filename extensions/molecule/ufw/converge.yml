---
- name: Converge
  hosts: all
  become: true
  tasks:
    - name: Include ctsc.sys.ufw
      ansible.builtin.include_role:
        name: ctsc.sys.ufw
      vars:
        ufw_allow_rules:
          - port: "2222"
            proto: tcp
            comment: "molecule test rule"
          - port: "4444"
            proto: tcp
            comment: "molecule test rule to be removed"
