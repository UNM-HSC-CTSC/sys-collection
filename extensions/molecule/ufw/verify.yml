---
- name: Verify
  hosts: all
  vars:
    ufw_test_allowed_rule_port: "2222/tcp"
    ufw_test_allowed_rule_comment: "molecule test rule"
    ufw_test_unlisted_port: "3333/tcp"
    ufw_test_removed_rule_port: "4444/tcp"
    ufw_test_any_port_src: "172.18.0.0/16"
    ufw_test_any_port_comment: "molecule test any-port rule"
    ufw_test_limit_rule_port: "2223/tcp"
    ufw_test_limit_rule_comment: "molecule test limit rule"
    ufw_test_removed_limit_rule_port: "5555/tcp"
  tasks:
    - name: Gather package facts
      ansible.builtin.package_facts:

    - name: Verify ufw is installed
      ansible.builtin.assert:
        that: "'ufw' in ansible_facts.packages"

    - name: Get ufw status
      ansible.builtin.command: ufw status verbose
      register: ufw_status
      changed_when: false

    - name: Verify ufw is active
      ansible.builtin.assert:
        that: "'Status: active' in ufw_status.stdout"
        fail_msg: "ufw is not active:\n{{ ufw_status.stdout }}"

    - name: Verify default policy is deny incoming / allow outgoing / deny routed
      ansible.builtin.assert:
        that:
          - "'deny (incoming)' in ufw_status.stdout"
          - "'allow (outgoing)' in ufw_status.stdout"
          - "'deny (routed)' in ufw_status.stdout"
        fail_msg: "Unexpected default policy:\n{{ ufw_status.stdout }}"

    - name: Verify the rule from ufw_allow_rules was actually added to ufw
      ansible.builtin.assert:
        that:
          - ufw_test_allowed_rule_port in ufw_status.stdout
          - "'ALLOW IN' in ufw_status.stdout"
          - ufw_test_allowed_rule_comment in ufw_status.stdout
        fail_msg: >-
          Expected an 'ALLOW IN' rule for {{ ufw_test_allowed_rule_port }}
          (comment: '{{ ufw_test_allowed_rule_comment }}') but it was not
          found in ufw status output:\n{{ ufw_status.stdout }}

    - name: Verify a port not in ufw_allow_rules was NOT allowed
      ansible.builtin.assert:
        that: ufw_test_unlisted_port not in ufw_status.stdout
        fail_msg: >-
          {{ ufw_test_unlisted_port }} appears in ufw status output even
          though it was never in ufw_allow_rules -- the allowlist is not
          being applied exactly:\n{{ ufw_status.stdout }}

    - name: "Verify a port: any rule allows all ports from its source"
      ansible.builtin.assert:
        that:
          - ufw_test_any_port_src in ufw_status.stdout
          - ufw_test_any_port_comment in ufw_status.stdout
        fail_msg: >-
          Expected an 'ALLOW IN' rule for all ports from
          {{ ufw_test_any_port_src }} (comment:
          '{{ ufw_test_any_port_comment }}') but it was not found in ufw
          status output:\n{{ ufw_status.stdout }}

    - name: Verify a rule dropped from ufw_allow_rules on a later run was pruned
      ansible.builtin.assert:
        that: ufw_test_removed_rule_port not in ufw_status.stdout
        fail_msg: >-
          {{ ufw_test_removed_rule_port }} was allowed during converge, then
          removed from ufw_allow_rules for the side_effect run, but it still
          appears in ufw status output -- stale rules are not being pruned
          when ufw_allow_rules changes:\n{{ ufw_status.stdout }}

    - name: "Verify a rule: limit entry was applied as a LIMIT rule"
      ansible.builtin.assert:
        that:
          - ufw_test_limit_rule_port in ufw_status.stdout
          - "'LIMIT IN' in ufw_status.stdout"
          - ufw_test_limit_rule_comment in ufw_status.stdout
        fail_msg: >-
          Expected a 'LIMIT IN' rule for {{ ufw_test_limit_rule_port }}
          (comment: '{{ ufw_test_limit_rule_comment }}') but it was not
          found in ufw status output:\n{{ ufw_status.stdout }}

    - name: Verify a limit rule dropped from ufw_allow_rules on a later run was pruned
      ansible.builtin.assert:
        that: ufw_test_removed_limit_rule_port not in ufw_status.stdout
        fail_msg: >-
          {{ ufw_test_removed_limit_rule_port }} was limited during converge,
          then removed from ufw_allow_rules for the side_effect run, but it
          still appears in ufw status output -- stale limit rules are not
          being pruned when ufw_allow_rules changes:\n{{ ufw_status.stdout }}

    - name: Verify outbound requests are actually allowed
      ansible.builtin.uri:
        url: https://www.google.com/
        method: GET
        status_code: 200
        timeout: 10
      register: ufw_outbound_check

    - name: Assert the outbound request succeeded
      ansible.builtin.assert:
        that: ufw_outbound_check.status == 200
        fail_msg: "Outbound HTTPS request failed even though ufw's default outgoing policy is allow"
