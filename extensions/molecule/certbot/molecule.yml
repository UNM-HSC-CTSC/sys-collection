---
driver:
  name: docker
platforms:
  - name: ubuntu2204
    image: ansible-sys-certbot-test-2204
    dockerfile: ../Dockerfile
    pre_build_image: false
    buildargs:
      UBUNTU_VERSION: "22.04"
    command: /lib/systemd/systemd
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    # Shared with the Pebble ACME test server started in prepare.yml, so the
    # instances can reach it by its container name ("pebble").
    networks:
      - name: certbot-molecule
  - name: ubuntu2404
    image: ansible-sys-certbot-test-2404
    dockerfile: ../Dockerfile
    pre_build_image: false
    buildargs:
      UBUNTU_VERSION: "24.04"
    command: /lib/systemd/systemd
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    networks:
      - name: certbot-molecule
provisioner:
  name: ansible
scenario:
  # cleanup removes the Pebble container, which has to happen before destroy
  # can remove the certbot-molecule network it's attached to.
  test_sequence:
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - cleanup
    - destroy
