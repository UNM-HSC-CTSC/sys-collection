---
- name: Ensure ufw package is installed
  ansible.builtin.apt:
    name: ufw
    state: present

- name: Configure UFW for Docker in /etc/ufw/after.rules
  ansible.builtin.blockinfile:
    path: /etc/ufw/after.rules
    marker: "# {mark} UFW AND DOCKER"
    insertafter: EOF
    block: |
      *filter
      :ufw-user-forward - [0:0]
      :ufw-docker-logging-deny - [0:0]
      :ufw-docker-inbound - [0:0]
      :DOCKER-USER - [0:0]
      -A DOCKER-USER -j ufw-user-forward

      -A DOCKER-USER -m conntrack --ctstate RELATED,ESTABLISHED -j RETURN
      -A DOCKER-USER -m conntrack --ctstate INVALID -j DROP
      -A DOCKER-USER -i docker0 -o docker0 -j ACCEPT

      {% if docker_ufw_block_container_egress %}
      # Containers may not start connections that leave their bridge. Exceptions are
      # `ufw route allow from <container subnet> to <destination> port N` rules,
      # which ufw-user-forward (above) evaluates first.
      {% for iface in docker_ufw_bridge_interfaces %}
      -A DOCKER-USER -i {{ iface }} ! -o {{ iface }} -m conntrack --ctstate NEW -j ufw-docker-logging-deny
      {% endfor %}

      {% endif %}
      # Only traffic heading INTO a Docker bridge is filtered here. Anything else
      # that is routed through this host (e.g. Kubernetes/Calico pod traffic) falls
      # through to the final RETURN and is left to its own rules.
      {% for iface in docker_ufw_bridge_interfaces %}
      -A DOCKER-USER -o {{ iface }} -j ufw-docker-inbound
      {% endfor %}
      -A DOCKER-USER -j RETURN

      # Traffic entering a Docker bridge: containers' own traffic is left to Docker;
      # everything else (i.e. inbound to published ports) is denied unless an
      # earlier `ufw route allow` rule (ufw-user-forward, above) accepted it. Match
      # the CONTAINER port in such rules, not the published host port.
      {% for iface in docker_ufw_bridge_interfaces %}
      -A ufw-docker-inbound -i {{ iface }} -j RETURN
      {% endfor %}
      -A ufw-docker-inbound -m conntrack --ctstate NEW -j ufw-docker-logging-deny
      -A ufw-docker-inbound -j RETURN

      -A ufw-docker-logging-deny -m limit --limit 3/min --limit-burst 10 -j LOG --log-prefix "[UFW DOCKER BLOCK] "
      -A ufw-docker-logging-deny -j DROP

      COMMIT
  notify: Reload ufw

- name: Enable ufw
  community.general.ufw:
    state: enabled
  notify: Reload ufw
